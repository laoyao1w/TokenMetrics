[package]
name = "token-hall"
version = "0.1.0"
description = "AI Token Hall desktop floating window"
edition = "2021"
rust-version = "1.77"

[lib]
name = "token_hall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "TokenMetrics"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
sysinfo = "0.33"
# Trae 国际版 SQLCipher 快照解密（在 Rust 侧执行，替掉前端 wasm/crypto 依赖）
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"

[dev-dependencies]
# 仅用于 cargo test 验证解密结果可被 sqlite 正常读取
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
