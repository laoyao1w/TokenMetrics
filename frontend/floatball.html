<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>猛蹬小球</title>
<script>
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
</script>
<style>
  :root {
    color-scheme: dark;
    --cyan: #35d3ff;
    --gold: #ffc861;
    --purple: #7c5cff;
    --ring-idle: rgba(53, 211, 255, 0.32);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent !important;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 悬浮球本体：60x60，居中于 80x80 透明窗口 */
  .ball {
    position: absolute;
    left: 10px;
    top: 10px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    cursor: pointer;
    border: 1.5px solid var(--ring-idle);
    background:
      radial-gradient(circle at 50% 32%, rgba(40, 58, 86, 0.98) 0%, rgba(18, 28, 46, 0.98) 52%, rgba(7, 12, 22, 0.98) 100%);
    box-shadow:
      inset 0 0 8px rgba(53, 211, 255, 0.15);
    transition: transform 0.18s ease, border-color 0.3s ease, filter 0.3s ease;
  }
  .ball:hover {
    transform: scale(1.06);
    border-color: rgba(53, 211, 255, 0.65);
  }

  /* 猛蹬时：金色流光圆环（顺时针流动） */
  .ball::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 2px;
    background:
      conic-gradient(from var(--flow),
        rgba(53, 211, 255, 0) 0deg,
        rgba(53, 211, 255, 1) 90deg,
        rgba(124, 92, 255, 1) 180deg,
        rgba(255, 200, 97, 1) 270deg,
        rgba(53, 211, 255, 0) 360deg);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    opacity: 0;
    pointer-events: none;
    animation: ballBorderFlow 4s linear infinite;
  }
  @property --flow { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes ballBorderFlow { to { --flow: 360deg; } }
  .ball.riding {
    border-color: rgba(255, 200, 97, 0.65);
  }
  .ball.riding::before { opacity: 1; }

  /* 醍醐骑车 SVG：非猛蹬时暂停一切动画并略微变暗 */
  .pelican {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 59px;
    height: 59px;
    transform: translate(-50%, -50%) translateY(-5px);
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 3px rgba(53, 211, 255, 0.35));
    opacity: 0.82;
    transition: opacity 0.3s ease, filter 0.3s ease;
    pointer-events: none;
  }
  .ball.riding .pelican {
    opacity: 1;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9));
  }
  .ball:not(.riding) * {
    animation-play-state: paused;
  }

  @keyframes wheelSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .bike-wheel {
    animation: wheelSpin 1s linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes bodyBounce {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-4px) rotate(3deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  .pelican-body { transform-origin: 45px 55px; animation: bodyBounce 0.2s infinite linear; }

  @keyframes wingFlap {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-15deg); }
  }
  .wing { transform-origin: 30px 40px; animation: wingFlap 0.2s infinite alternate ease-in-out; }

  @keyframes beakPant {
    0%, 45% { transform: rotate(0deg); }
    60%, 85% { transform: rotate(-10deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes lowerBeakPant {
    0%, 45% { transform: rotate(0deg); }
    60%, 85% { transform: rotate(12deg); }
    100% { transform: rotate(0deg); }
  }
  .beak-top { transform-box: fill-box; transform-origin: 0% 90%; animation: beakPant 0.7s ease-in-out infinite; }
  .beak-bottom { transform-box: fill-box; transform-origin: 0% 10%; animation: lowerBeakPant 0.7s ease-in-out infinite; }
  .beak-seam {
    stroke: rgba(95, 54, 10, 0.55);
    stroke-width: 1;
    stroke-linecap: round;
    fill: none;
  }

  .crank-arm { stroke: rgba(255, 255, 255, 0.42); stroke-width: 1.8; stroke-linecap: round; }
  .pedal-body { fill: #9fb2cc; }
  .pedal-top { fill: #f4f8ff; }
  .chainring,
  .crank-assembly {
    transform-box: fill-box;
    transform-origin: center;
  }
  .leg-link-backdrop {
    stroke: rgba(10, 18, 32, 0.78);
    stroke-width: 6.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .leg-link { stroke-width: 4.4; stroke-linecap: round; stroke-linejoin: round; }
  .leg-link.front { stroke: var(--cyan); }
  .leg-link.back { stroke: #506788; }
  .leg-foot { stroke: #eef4ff; stroke-width: 3.2; stroke-linecap: round; }
  .leg-joint { fill: #eef4ff; stroke: rgba(10, 18, 32, 0.45); stroke-width: 1.2; }

  @keyframes sweatFly {
    0% { transform: translate(0, 0); opacity: 1; }
    100% { transform: translate(12px, -8px); opacity: 0; }
  }
  .sweat { animation: sweatFly 0.4s infinite; }
  .sweat:nth-child(2) { animation-delay: 0.2s; }
</style>
</head>
<body>
  <div class="ball" id="ball">
    <svg class="pelican" viewBox="0 0 100 100" width="54" height="54">
      <defs>
        <g id="wheel">
          <circle cx="0" cy="0" r="15" fill="none" stroke="#93a6c3" stroke-width="2.5"/>
          <circle cx="0" cy="0" r="13" fill="none" stroke="#121c2e" stroke-width="2"/>
          <circle cx="0" cy="0" r="2.5" fill="#35d3ff"/>
          <line x1="0" y1="-15" x2="0" y2="15" stroke="#93a6c3" stroke-width="0.5" opacity="0.6"/>
          <line x1="-15" y1="0" x2="15" y2="0" stroke="#93a6c3" stroke-width="0.5" opacity="0.6"/>
          <line x1="-10.6" y1="-10.6" x2="10.6" y2="10.6" stroke="#93a6c3" stroke-width="0.5" opacity="0.6"/>
          <line x1="-10.6" y1="10.6" x2="10.6" y2="-10.6" stroke="#93a6c3" stroke-width="0.5" opacity="0.6"/>
        </g>
      </defs>
      <g transform="translate(25, 75)"><g class="bike-wheel"><use href="#wheel"/></g></g>
      <g transform="translate(75, 75)"><g class="bike-wheel"><use href="#wheel"/></g></g>

      <g class="leg-back">
        <line class="leg-link-backdrop" id="backThighBack" x1="41" y1="49" x2="38" y2="58"/>
        <line class="leg-link back" id="backThigh" x1="41" y1="49" x2="38" y2="58"/>
        <line class="leg-link-backdrop" id="backCalfBack" x1="38" y1="58" x2="42" y2="67"/>
        <line class="leg-link back" id="backCalf" x1="38" y1="58" x2="42" y2="67"/>
        <line class="leg-foot" id="backFoot" x1="40" y1="67" x2="44" y2="67"/>
        <circle class="leg-joint" id="backKnee" cx="38" cy="58" r="2.1"/>
      </g>

      <g id="back-drive">
        <g class="crank-assembly">
          <line class="crank-arm" id="backCrankArm" x1="50" y1="72" x2="41.4" y2="66.8"/>
          <rect class="pedal-body" id="backPedalBody" x="39.1" y="65.3" width="4.8" height="3" rx="1.1"/>
          <rect class="pedal-top" id="backPedalTop" x="38.4" y="63.4" width="6.2" height="2.1" rx="1"/>
        </g>
      </g>

      <path d="M 25 75 L 50 72 M 25 75 L 44 50 M 50 72 L 44 50 M 50 72 L 60 42 M 44 50 L 60 42 M 44 50 L 44 46 L 48 46 M 60 42 L 75 75 M 60 42 L 62 37 M 57 37 L 67 37 M 57 37 L 56 40 M 67 37 L 68 40" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <g id="drivetrain">
        <circle cx="50" cy="72" r="6" fill="none" stroke="#35d3ff" stroke-width="1.5" class="chainring" stroke-dasharray="3 3"/>
        <circle cx="50" cy="72" r="1.5" fill="#35d3ff"/>
        <g class="crank-assembly">
          <line class="crank-arm" id="frontCrankArm" x1="50" y1="72" x2="58.6" y2="77.2"/>
          <rect class="pedal-body" id="frontPedalBody" x="57.1" y="75.8" width="4.8" height="3" rx="1.1"/>
          <rect class="pedal-top" id="frontPedalTop" x="56.4" y="73.9" width="6.2" height="2.1" rx="1"/>
        </g>
      </g>

      <g class="pelican-body">
        <path d="M 26 46 C 18 44, 14 38, 18 34 C 24 36, 28 40, 30 44 Z" fill="#c3d2ea"/>
        <path d="M 28 50 C 20 38, 26 24, 40 24 C 52 24, 56 36, 54 46 C 52 56, 34 58, 28 50 Z" fill="#f4f8ff"/>
        <path d="M 34 34 C 44 30, 54 36, 48 46 C 40 50, 30 44, 34 34 Z" fill="#d5e2f5" class="wing"/>
        <path d="M 40 26 C 42 18, 46 14, 52 13 C 56 13, 56 21, 50 25 C 46 27, 42 27, 40 26 Z" fill="#f4f8ff"/>
        <circle cx="54" cy="12" r="5.5" fill="#f4f8ff"/>
        <g class="beak-top">
          <path d="M 58 10 C 72 2, 88 8, 86 15 C 80 17, 70 14, 58 14 Z" fill="#ffc861"/>
        </g>
        <g class="beak-bottom">
          <path d="M 57.55 15.05 C 65.2 16.15, 74.6 17.05, 80.25 18.55 C 72.8 21.25, 63.4 20.65, 58.3 18.45 C 57.7 17.25, 57.35 16.05, 57.55 15.05 Z" fill="#ff9c3a"/>
          <path d="M 57.65 15.1 C 61.1 14.95, 64.2 14.95, 67.3 15.3" class="beak-seam"/>
        </g>
        <circle cx="52" cy="11" r="1.6" fill="#121c2e"/>
        <circle cx="52.6" cy="10.6" r="0.6" fill="#fff"/>
        <path d="M 63 4 Q 67 0 67 4" fill="none" stroke="#35d3ff" stroke-width="1.5" class="sweat"/>
        <path d="M 58 2 Q 62 -2 62 2" fill="none" stroke="#35d3ff" stroke-width="1.5" class="sweat"/>
      </g>

      <g class="leg-front">
        <line class="leg-link-backdrop" id="frontThighBack" x1="44" y1="50" x2="48" y2="61"/>
        <line class="leg-link front" id="frontThigh" x1="44" y1="50" x2="48" y2="61"/>
        <line class="leg-link-backdrop" id="frontCalfBack" x1="48" y1="61" x2="58" y2="77"/>
        <line class="leg-link front" id="frontCalf" x1="48" y1="61" x2="58" y2="77"/>
        <line class="leg-foot" id="frontFoot" x1="56" y1="77" x2="61" y2="77"/>
        <circle class="leg-joint" id="frontKnee" cx="48" cy="61" r="2.2"/>
      </g>
    </svg>
  </div>

<script>
(function () {
  var ball = document.getElementById("ball");
  var svg = document.querySelector(".pelican");
  var pelicanRaf = null;

  function stopPedaling() {
    if (pelicanRaf) {
      cancelAnimationFrame(pelicanRaf);
      pelicanRaf = null;
    }
  }

  function setLine(line, x1, y1, x2, y2) {
    if (!line) return;
    line.setAttribute("x1", x1.toFixed(2));
    line.setAttribute("y1", y1.toFixed(2));
    line.setAttribute("x2", x2.toFixed(2));
    line.setAttribute("y2", y2.toFixed(2));
  }

  function setRect(rect, x, y, width, height, angle) {
    if (!rect) return;
    rect.setAttribute("x", x.toFixed(2));
    rect.setAttribute("y", y.toFixed(2));
    rect.setAttribute("width", width.toFixed(2));
    rect.setAttribute("height", height.toFixed(2));
    var cx = x + width / 2;
    var cy = y + height / 2;
    rect.setAttribute("transform", "rotate(" + angle.toFixed(2) + " " + cx.toFixed(2) + " " + cy.toFixed(2) + ")");
  }

  function solveKnee(hip, foot, upperLen, lowerLen, bendSide) {
    var dx = foot.x - hip.x;
    var dy = foot.y - hip.y;
    var dist = Math.max(0.001, Math.hypot(dx, dy));
    var clamped = Math.min(dist, upperLen + lowerLen - 0.001);
    var ux = dx / dist;
    var uy = dy / dist;
    var a = (upperLen * upperLen - lowerLen * lowerLen + clamped * clamped) / (2 * clamped);
    var h = Math.sqrt(Math.max(upperLen * upperLen - a * a, 0));
    var mx = hip.x + ux * a;
    var my = hip.y + uy * a;
    var px = -uy * h * bendSide;
    var py = ux * h * bendSide;
    return { x: mx + px, y: my + py };
  }

  function drawLeg(parts, hip, foot, upperLen, lowerLen, bendSide, footAngle, footHalf) {
    var knee = solveKnee(hip, foot, upperLen, lowerLen, bendSide);
    setLine(parts.thighBack, hip.x, hip.y, knee.x, knee.y);
    setLine(parts.thigh, hip.x, hip.y, knee.x, knee.y);
    setLine(parts.calfBack, knee.x, knee.y, foot.x, foot.y);
    setLine(parts.calf, knee.x, knee.y, foot.x, foot.y);

    var footRadius = footHalf || 3.2;
    var fx = Math.cos(footAngle) * footRadius;
    var fy = Math.sin(footAngle) * footRadius;
    setLine(parts.foot, foot.x - fx, foot.y - fy, foot.x + fx, foot.y + fy);

    if (parts.knee) {
      parts.knee.setAttribute("cx", knee.x.toFixed(2));
      parts.knee.setAttribute("cy", knee.y.toFixed(2));
    }
  }

  function startPedaling() {
    if (pelicanRaf) return;
    if (!svg) return;

    var drivetrain = svg.querySelector("#drivetrain");
    var backDrive = svg.querySelector("#back-drive");

    var frontLeg = {
      thighBack: svg.querySelector("#frontThighBack"),
      thigh: svg.querySelector("#frontThigh"),
      calfBack: svg.querySelector("#frontCalfBack"),
      calf: svg.querySelector("#frontCalf"),
      foot: svg.querySelector("#frontFoot"),
      knee: svg.querySelector("#frontKnee")
    };
    var backLeg = {
      thighBack: svg.querySelector("#backThighBack"),
      thigh: svg.querySelector("#backThigh"),
      calfBack: svg.querySelector("#backCalfBack"),
      calf: svg.querySelector("#backCalf"),
      foot: svg.querySelector("#backFoot"),
      knee: svg.querySelector("#backKnee")
    };

    var config = {
      center: { x: 50, y: 72 },
      crankRadius: 10,
      frontHip: { x: 43.6, y: 49.8 },
      backHip: { x: 40.8, y: 48.7 },
      frontUpper: 12.8,
      frontLower: 18.4,
      backUpper: 11.6,
      backLower: 14.8,
      footAngle: Math.PI / 10,
      cycleMs: 980,
      startAngle: Math.PI / 6
    };

    var start = performance.now();

    function renderFrame(now) {
      // 停止猛蹬后立即退出循环，避免动画在后台空转
      if (!ball.classList.contains("riding")) {
        pelicanRaf = null;
        return;
      }
      var t = ((now - start) % config.cycleMs) / config.cycleMs;
      var angle = config.startAngle + t * Math.PI * 2;
      var frontPedal = {
        x: config.center.x + Math.cos(angle) * config.crankRadius,
        y: config.center.y + Math.sin(angle) * config.crankRadius
      };
      var backPedal = {
        x: config.center.x - Math.cos(angle) * config.crankRadius,
        y: config.center.y - Math.sin(angle) * config.crankRadius
      };
      var backHiddenFoot = {
        x: config.center.x + (backPedal.x - config.center.x) * 0.76,
        y: config.center.y + (backPedal.y - config.center.y) * 0.76
      };

      if (drivetrain) {
        drivetrain.setAttribute(
          "transform",
          "rotate(" + ((angle - config.startAngle) * 180 / Math.PI).toFixed(2) + " " + config.center.x + " " + config.center.y + ")"
        );
      }
      if (backDrive) {
        backDrive.setAttribute(
          "transform",
          "rotate(" + ((angle - config.startAngle) * 180 / Math.PI).toFixed(2) + " " + config.center.x + " " + config.center.y + ")"
        );
      }

      drawLeg(frontLeg, config.frontHip, frontPedal, config.frontUpper, config.frontLower, 1, config.footAngle, 3.2);
      drawLeg(backLeg, config.backHip, backHiddenFoot, config.backUpper, config.backLower, -1, -config.footAngle, 1.65);

      pelicanRaf = requestAnimationFrame(renderFrame);
    }

    pelicanRaf = requestAnimationFrame(renderFrame);
  }

  function setRiding(riding) {
    var wasRiding = ball.classList.contains("riding");
    ball.classList.toggle("riding", riding);
    if (riding) {
      startPedaling();
    } else if (wasRiding) {
      stopPedaling();
    }
  }

  var dragStart = null;   // 指针按下位置；非空表示正在按下
  var dragged = false;    // 本次按下是否已触发拖动（用于屏蔽拖动后的误点击）

  ball.addEventListener("pointerdown", function (e) {
    dragStart = { x: e.clientX, y: e.clientY };
    dragged = false;
  });

  ball.addEventListener("pointermove", function (e) {
    if (!dragStart) return;
    var dx = e.clientX - dragStart.x;
    var dy = e.clientY - dragStart.y;
    // 超过阈值即视为拖动，交给系统原生拖拽窗口
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
      dragStart = null;
      dragged = true;
      if (window.__TAURI__) {
        window.__TAURI__.core.invoke("start_window_drag").catch(function () {});
      }
    }
  });

  ball.addEventListener("click", function () {
    // 刚结束拖动时的点击不处理，避免误弹出主窗口
    if (dragged) return;
    if (window.__TAURI__) {
      window.__TAURI__.core.invoke("show_main_window").catch(function () {});
    }
  });

  if (window.__TAURI__) {
    window.__TAURI__.event.listen("floatball-activity", function (event) {
      if (event && event.payload) setRiding(!!event.payload.active);
    }).catch(function () {});
    // 页面加载时同步一次当前的猛蹬状态，避免闪烁
    window.__TAURI__.core.invoke("get_floatball_state").then(function (active) {
      setRiding(!!active);
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
